<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="darkBg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#241F30"/>
      <stop offset="100%" stop-color="#0F0D13"/>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="headband" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3d4d"/>
      <stop offset="100%" stop-color="#1e2029"/>
    </linearGradient>

    <linearGradient id="cupAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4C578"/>
      <stop offset="100%" stop-color="#E3A84E"/>
    </linearGradient>
  </defs>

  <!-- Musillow dark background -->
  <rect width="500" height="500" rx="96" fill="url(#darkBg)"/>

  <!-- Ground shadow, dialled down for dark bg -->
  <ellipse cx="250" cy="420" rx="110" ry="18" fill="#000000" opacity="0.35"/>

  <g filter="url(#shadow)">
    <!-- Marshmallow body -->
    <g id="marshmallow-body">
      <path d="M 150 180
               L 150 340
               A 100 30 0 0 0 350 340
               L 350 180
               Z"
            fill="#FFF6EA"/>
      <ellipse cx="250" cy="180" rx="100" ry="30" fill="#FFF6EA"/>
      <path d="M 150 180 A 100 30 0 0 0 350 180" fill="none" stroke="#E9D3B4" stroke-width="2"/>
    </g>

    <!-- Headband -->
    <path d="M 155 180 A 110 105 0 0 1 345 180"
          fill="none"
          stroke="url(#headband)"
          stroke-width="16"
          stroke-linecap="round"/>
    <path d="M 160 178 A 102 98 0 0 1 340 178"
          fill="none"
          stroke="#121318"
          stroke-width="3"
          stroke-linecap="round"/>

    <!-- Face -->
    <g id="face">
      <ellipse cx="205" cy="250" rx="10" ry="14" fill="#222531"/>
      <circle cx="201" cy="245" r="4" fill="#ffffff"/>
      <circle cx="207" cy="254" r="1.8" fill="#ffffff"/>

      <ellipse cx="295" cy="250" rx="10" ry="14" fill="#222531"/>
      <circle cx="291" cy="245" r="4" fill="#ffffff"/>
      <circle cx="297" cy="254" r="1.8" fill="#ffffff"/>

      <ellipse cx="188" cy="266" rx="10" ry="5" fill="#ff8da9" opacity="0.5"/>
      <ellipse cx="312" cy="266" rx="10" ry="5" fill="#ff8da9" opacity="0.5"/>

      <path d="M 235 264 Q 250 280 265 264"
            fill="none"
            stroke="#222531"
            stroke-width="4"
            stroke-linecap="round"/>
    </g>

    <!-- Earphones, recolored amber to match Musillow's palette -->
    <g id="earphones">
      <g id="left-earphone">
        <rect x="134" y="175" width="16" height="25" rx="4" fill="#2a2d3a"/>
        <rect x="118" y="190" width="28" height="80" rx="14" fill="url(#cupAmber)" filter="url(#glow)"/>
        <rect x="140" y="194" width="12" height="72" rx="6" fill="#181920"/>
        <line x1="130" y1="202" x2="130" y2="258" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
      </g>

      <g id="right-earphone">
        <rect x="350" y="175" width="16" height="25" rx="4" fill="#2a2d3a"/>
        <rect x="354" y="190" width="28" height="80" rx="14" fill="url(#cupAmber)" filter="url(#glow)"/>
        <rect x="348" y="194" width="12" height="72" rx="6" fill="#181920"/>
        <line x1="366" y1="202" x2="366" y2="258" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
      </g>
    </g>
  </g>
</svg>
